# Replace your-domain.com below with your real domain, then:
#   sudo cp nginx.conf /etc/nginx/sites-available/threeohone
#   sudo ln -s /etc/nginx/sites-available/threeohone /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# certbot --nginx will edit this file automatically to add HTTPS.

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # Streamlit runs over a websocket -- these headers are required or
        # the app will load but never actually connect.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
    }
}

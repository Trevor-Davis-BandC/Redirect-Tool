name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Run deploy script on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: threeohone
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The deploy key is restricted server-side (via a `command=`
          # forced-command in authorized_keys) to only ever run
          # deploy/deploy.sh, regardless of what's sent here -- this line
          # is really just documentation of that intent.
          script: /home/threeohone/Redirect-Tool/deploy/deploy.sh
